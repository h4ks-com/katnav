[package]
name = "katnav"
description = "A web browser in your terminal: Chromium's pixels over the kitty graphics protocol"
repository = "https://github.com/h4ks-com/katnav"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["command-line-utilities", "web-programming"]
keywords = ["terminal", "browser", "kitty-graphics", "chromium"]

[dependencies]
cef = { version = "=156.5.0", default-features = false }
katui = { version = "0.0.5", default-features = false }
thiserror = "2"

[lints.rust]
unsafe_code = "deny"
unknown_lints = { level = "allow", priority = -2 }
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
indexing_slicing = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
